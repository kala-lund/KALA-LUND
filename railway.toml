# Railway deployment configuration - FinRL Trader V2 backend.
#
# Entry point: scripts/run_trader.py -> uvicorn trader.api.server:app
# (verified: scripts/run_trader.py reads API_HOST / API_PORT / PORT from
#  trader/core/config.py and calls uvicorn.run(..., host=..., port=...))
#
# Health check: GET /api/v2/health -> HTTP 200
# (verified route in trader/api/server.py; returns {"ok":..., "mode":"paper", ...})
#
# SCHEMA NOTE (verified against https://docs.railway.com/reference/config-as-code
# and the live https://railway.com/railway.schema.json):
#   * Only the [build], [deploy] and [environments] tables (plus $schema) are
#     valid here.
#   * restartPolicyType must be one of ON_FAILURE / ALWAYS / NEVER (upper case).
#   * Environment variables CANNOT be set from this file. An earlier revision
#     declared them in a [deploy.environment] table, which is not part of the
#     schema; those values were silently never applied. Safety defaults now live
#     in Dockerfile.trader (ENV) and every remaining variable must be set as a
#     Railway service variable in the dashboard.
#   * Config-as-code is deprecated upstream (existing files keep working until
#     2026-12-01). Revisit / migrate to Infrastructure as Code before that date.
#
# Required Railway service variables (dashboard, names only):
#   DATABASE_URL        - Neon *pooled* DSN (required: durable state).
#                         Use the -pooler host from the Neon console; it is
#                         IPv4-reachable (Railway cannot reach IPv6-only hosts).
#                         Add ?sslmode=require (also enforced by the app for
#                         non-local hosts). See docs/DEPLOYMENT_NEON.md.
#   DATABASE_URL_UNPOOLED - optional Neon direct DSN for migrations/admin only.
#   REQUIRE_DURABLE_STORE - set "true" in production; startup fails closed
#                         instead of silently using in-memory storage.
#   CORS_ORIGINS        - comma-separated frontend origins, e.g. https://<project>.pages.dev
#   TRUST_PROXY_HEADERS - set "true" behind Railway's edge so per-client rate
#                         limiting uses the appended X-Forwarded-For address
#   DASHBOARD_PASSWORD  - gates order / kill-switch / automation endpoints
#   ALPACA_API_KEY      - Alpaca PAPER key id (optional until market data is needed)
#   ALPACA_API_SECRET   - Alpaca PAPER secret (optional until market data is needed)
#   REDIS_URL           - optional Redis cache (falls back to in-process cache)
#   CLAUDE_ENABLED      - optional Muse AI decision support (default false)
#   CLAUDE_API_KEY      - optional Muse AI key
#
# NOTE: secrets are never committed here.

[build]
  # Pin the Dockerfile builder. Without this Railway defaults to Railpack for new
  # services, which would try to build this Python repo without the container image.
  builder = "DOCKERFILE"
  # Non-standard Dockerfile name: Railway does not auto-detect it, so the path is
  # mandatory. The file is tracked at the repository root (see Dockerfile.trader).
  dockerfilePath = "Dockerfile.trader"

[deploy]
  startCommand = "python scripts/run_trader.py"
  healthcheckPath = "/api/v2/health"
  healthcheckTimeout = 60
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
