<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader — Paper Trading Command Center</title>
<link rel="stylesheet" href="/static/styles.css?v=5">
</head>
<body>
<!-- Password modal (shown once per session) -->
<div id="authModal" class="modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="brand">Trader</div>
      <div class="pill paper">PAPER</div>
    </div>
    <h2>Enter Dashboard Password</h2>
    <p class="muted">Session password required to access trading controls. Check your <code>.env</code> file for <code>DASHBOARD_PASSWORD</code>.</p>
    <input type="password" id="authPwd" placeholder="Password" autocomplete="current-password">
    <div class="muted" id="authErr" style="color:var(--bad); margin-top:8px;"></div>
    <button class="btn" id="authBtn">Unlock Dashboard</button>
  </div>
</div>

<header class="topbar">
  <div class="left">
    <div class="brand">Trader</div>
    <div class="conn" id="conn"><span class="dot"></span>Connecting…</div>
  </div>
  <div class="center">
    <div class="kv"><span class="k">Mode</span><span class="v" id="sysMode">—</span></div>
    <div class="kv"><span class="k">Symbols</span><span class="v" id="sysSymbols">—</span></div>
    <div class="kv"><span class="k">Timeframe</span><span class="v" id="sysTf">—</span></div>
  </div>
  <div class="right">
    <div class="auto-card" id="autoCard">
      <div class="ac-title">Automation</div>
      <div class="ac-status" id="autoStatus">Offline</div>
      <div class="ac-detail" id="autoDetail">—</div>
    </div>
    <button class="btn secondary" id="btnRefresh"><span>↻</span> Refresh</button>
    <button class="btn" id="btnLogout">Logout</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <nav id="sidebarNav"></nav>
  </aside>
  <main class="workarea">
    <div id="pageHeader"></div>
    <div id="page"></div>
  </main>
</div>

<div id="toasts"></div>
<!-- API base URL resolution order:
     1. window.API_BASE_URL       - explicit override (hosting provider injection)
     2. window.FINRL_API_BASE_URL - from config.js (regenerated by the Cloudflare
        Pages build step from the API_BASE_URL environment variable)
     3. "" (empty)                - same origin (self-hosted FastAPI)
     config.js is loaded before app.js so the value is always defined. -->
<script src="/static/config.js?v=5"></script>
<script>window.API_BASE_URL = window.API_BASE_URL || window.FINRL_API_BASE_URL || "";</script>
<script src="/static/app.js?v=5"></script>
</body>
</html>
