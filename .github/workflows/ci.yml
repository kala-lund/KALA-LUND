name: CI

# Lightweight CI for the FinRL Trader V2 application layer.
# - Uses the same Python version as Dockerfile.trader (3.11).
# - Never requires broker credentials, live APIs, or external services.
# - The upstream FinRL container test (test.yml) is kept separate and unchanged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trader-api:
    name: Trader V2 API (unit + API tests)
    runs-on: ubuntu-latest
    env:
      # Hard safety defaults: paper mode, no orders, no live trading.
      TRADING_MODE: paper
      ENABLE_PAPER_ORDERS: "false"
      ENABLE_LIVE_TRADING: "false"
      # Point the app at an isolated temp dir so tests never touch repo artifacts.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install "pytest>=7.4" "pytest-cov>=4.1" "httpx>=0.27"

      - name: Syntax / compile check (app + scripts)
        run: python -m compileall -q trader scripts backend/app

      - name: Trader V2 tests
        run: pytest trader/tests -q --tb=short -p no:cacheprovider

      - name: Backend app tests
        run: pytest backend/tests -q --tb=short -p no:cacheprovider

  frontend:
    name: Frontend build (static assets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend bundle (no network, no dependencies)
        run: node scripts/build_frontend.js

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/_redirects
          test -f dist/config.js
